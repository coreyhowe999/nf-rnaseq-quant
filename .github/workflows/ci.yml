name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: nextflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "23.10.0"

      - name: Lint pipeline config
        run: nextflow config -profile test . > /dev/null

      - name: Dry-run parse main.nf
        run: nextflow run main.nf -preview -profile test || true

  test:
    name: end-to-end (test profile, docker)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "23.10.0"

      - name: Run test profile
        run: nextflow run main.nf -profile test,docker --outdir ./results-ci

      - name: Show MultiQC report exists
        run: test -f results-ci/multiqc/multiqc_report.html
